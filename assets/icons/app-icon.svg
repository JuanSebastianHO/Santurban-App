            <stop offset="0%" stop-color="#0f1914" />
            <stop offset="100%" stop-color="#1e3128" />
        </linearGradient>
        <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#40916c" />
            <stop offset="100%" stop-color="#2d6a4f" />
